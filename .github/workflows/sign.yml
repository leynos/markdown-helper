name: sign

# Signing is the one job that touches the AMO credential, so it runs only for
# release tags and only after the `release` environment's reviewer approves.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  sign:
    name: Sign and publish the XPI
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - name: Install the pinned tools
        run: bun install --frozen-lockfile

      - name: Check the tag matches the declared version
        env:
          VERSION: ${{ github.ref_name }}
        run: make check-version

      - name: Sign with addons.mozilla.org
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: make sign

      - name: Publish the signed XPI
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.xpi --generate-notes
